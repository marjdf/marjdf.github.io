<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Morning, Daddy!</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; line-height: 1.6; max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; color: #333; }
        .sweet { font-weight: bold; font-size: 1.4em; color: #d36060; }
        .funny { font-style: italic; color: #1a7f37; }
    </style>
</head>
<body>
    <p class="sweet">Good morning, Daddy! Work hard today.</p>
    
    <p class="funny">...just remember, if you fix a bug in production at 9:00 AM, the chances of it coming back to life as a recursive nightmare by 5:00 PM is approximately 110%.</p>

    <p>Love you! Have an amazing, bug-free day.</p>
</body>
</html>
